name: NPM Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Get current version from package.json
        id: current-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if version exists in NPM
        id: check-version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=${{ steps.current-version.outputs.version }}
          npm view "${PACKAGE_NAME}@${VERSION}" version > /dev/null 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already exists in NPM registry"
            exit 0
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION is new, will publish"
            exit 0
          else
            echo "::error::Failed to check version in NPM registry (exit code: $EXIT_CODE). Check authentication and network connectivity."
            exit $EXIT_CODE
          fi

      - name: Validate NPM token
        if: github.event_name != 'pull_request' && steps.check-version.outputs.exists == 'false'
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN secret is missing. Please check NPM_TOKEN secret."
            exit 1
          fi

      - name: Install dependencies
        if: github.event_name == 'pull_request' || steps.check-version.outputs.exists == 'false'
        run: npm ci

      - name: Build project
        if: github.event_name == 'pull_request' || steps.check-version.outputs.exists == 'false'
        run: npm run build

      - name: Build check (PR only)
        if: github.event_name == 'pull_request'
        run: echo "Build successful - ready for merge"

      - name: Publish to NPM
        if: github.event_name != 'pull_request' && steps.check-version.outputs.exists == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip publish
        if: steps.check-version.outputs.exists == 'true'
        run: echo "Skipping publish - version ${{ steps.current-version.outputs.version }} already exists in NPM registry"
