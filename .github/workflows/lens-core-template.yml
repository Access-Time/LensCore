name: LensCore Accessibility CI

on:
  workflow_call:
    inputs:
      url:
        required: true
        type: string
      version:
        required: false
        type: string
        default: 'latest'
      max_urls:
        required: false
        type: number
        default: 10
      scan_depth:
        required: false
        type: number
        default: 2
      timeout:
        required: false
        type: number
        default: 30000
      vercel_bypass_header_name:
        required: false
        type: string
        default: x-vercel-protection-bypass
    secrets:
      VERCEL_BYPASS_TOKEN:
        required: false

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Pull LensCore image
        run: docker pull accesstimeco/lenscore:${{ inputs.version }}

      - name: Start LensCore
        run: |
          docker run -d \
            --name lenscore \
            --network host \
            -e CACHE_TYPE=memory \
            -e NODE_ENV=production \
            accesstimeco/lenscore:${{ inputs.version }}

      - name: Wait for LensCore
        run: |
          timeout=60
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -sf "http://localhost:3001/api/health" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          docker logs lenscore || true
          exit 1

      - name: Run accessibility scan
        run: |
          HEADER_ARGS=""

          if [ -n "${{ secrets.VERCEL_BYPASS_TOKEN }}" ]; then
            HEADER_ARGS="--header \"${{ inputs.vercel_bypass_header_name }}: ${{ secrets.VERCEL_BYPASS_TOKEN }}\""
          fi

          docker exec lenscore sh -c \
            "node dist/cli.js scan \"${{ inputs.url }}\" \
              --ci \
              -u ${{ inputs.max_urls }} \
              -d ${{ inputs.scan_depth }} \
              -t ${{ inputs.timeout }} \
              --skip-cache \
              $HEADER_ARGS \
              -o /app/report.json \
              --no-exit-on-violations" || true

          docker cp lenscore:/app/report.json ./report.json || true

      - name: Generate summary
        if: always()
        run: |
          if [ -f report.json ]; then
            TOTAL_PAGES=$(jq -r '.accessibility.totalPages // .totalPages // 1' report.json)
            TOTAL_VIOLATIONS=$(jq '[.accessibility.results[].violations // [] | length] | add // 0' report.json 2>/dev/null || jq '.violations | length // 0' report.json)

            echo "## Accessibility Scan Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **URL:** ${{ inputs.url }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Pages scanned:** $TOTAL_PAGES" >> $GITHUB_STEP_SUMMARY
            echo "- **Total violations:** $TOTAL_VIOLATIONS" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: lenscore-accessibility-report
          path: report.json
          retention-days: 7
          if-no-files-found: warn

      - name: Stop LensCore
        if: always()
        run: |
          docker stop lenscore || true
          docker rm lenscore || true
